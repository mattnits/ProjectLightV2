name: ProjectLight CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake --preset windows-debug

      - name: Build
        run: cmake --build --preset windows-debug

      - name: Run tests
        run: ctest --test-dir build/windows-debug --output-on-failure

  format:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find engine sandbox tests \
            -type f \( -name "*.cpp" -o -name "*.h" \) \
            -print0 |
          xargs -0 clang-format --dry-run --Werror

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy ninja-build

      - name: Configure
        run: >
          cmake -S . -B build/clang-tidy -G Ninja
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DGLFW_BUILD_X11=OFF
          -DGLFW_BUILD_WAYLAND=OFF
          -DPROJECTLIGHT_BUILD_TESTS=OFF

      - name: Run clang-tidy
        run: |
          find engine/src \
            -type f -name "*.cpp" \
            -print0 |
          xargs -0 -n1 clang-tidy -p build/clang-tidy
