name: ProjectLight CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake --preset windows-debug

      - name: Build
        run: cmake --build --preset windows-debug

      - name: Run tests
        run: ctest --test-dir build/windows-debug --output-on-failure